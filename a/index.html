function lastTop(c,n){var m=-1e9,mi=0;for(var i=c.cols.length-n;i<c.cols.length;i++){if(c.cols[i][2]>m){m=c.cols[i][2]}}return m}
function trendNow(c){
  var last=c.cols.length-1,e=null;c.tl.forEach(function(x){if(x[1]<=last&&x[3]>=last)e=x});
  if(!e)return null;var d=e[0]==='bull'?1:-1,idx=e[2]+d*(last-e[1]);return {kind:e[0],level:lv(c,idx)};
}

  return [
   {q:{en:'What does an X mean on the chart?',bn:'চার্টে X মানে কী?'},opts:ox,ans:0,ref:'Ch. 2'},
   {q:{en:'What does an O mean on the chart?',bn:'চার্টে O মানে কী?'},opts:ox,ans:1,ref:'Ch. 2'},
   {q:{en:'In the standard method, how many boxes must price reverse before a new column starts?',bn:'প্রচলিত পদ্ধতিতে নতুন কলাম শুরুর আগে দাম কত বক্স উল্টো যেতে হয়?'},opts:[{en:'One',bn:'এক'},{en:'Three',bn:'তিন'},{en:'Five',bn:'পাঁচ'}],ans:1,ref:'Ch. 2, reversal'},
   {q:{en:'Which of these does the chart leave out?',bn:'চার্ট এর মধ্যে কোনটি বাদ দেয়?'},opts:[{en:'Price',bn:'দাম'},{en:'The passing of time',bn:'সময়ের চলে যাওয়া'},{en:'Box size',bn:'বক্সের মাপ'}],ans:1,ref:'Ch. 2'},
   {q:{en:'On this GP chart, whose column is the latest?',bn:'এই জিপি চার্টে সর্বশেষ কলাম কার?'},chart:g,opts:[{en:'Buyers (X’s)',bn:'ক্রেতা (X)'},{en:'Sellers (O’s)',bn:'বিক্রেতা (O)'}],ans:g.col==='X'?0:1,ref:'Chs. 2 to 7'},
   {q:{en:'On this BRAC Bank chart, is the latest price above or below the current 45-degree line (near '+pr(tn.level)+')?',bn:'এই ব্র্যাক ব্যাংক চার্টে সর্বশেষ দাম বর্তমান ৪৫ ডিগ্রি রেখার (প্রায় '+pr(tn.level)+') ওপরে না নিচে?'},chart:b,trend:true,opts:[{en:'Above',bn:'ওপরে'},{en:'Below',bn:'নিচে'}],ans:above?0:1,ref:'Chs. 2 to 7'},
   {q:{en:'In a top-down reading, which do you read first?',bn:'ওপর থেকে নিচে পাঠে আগে কোনটি পড়েন?'},opts:[{en:'The single stock',bn:'একটি শেয়ার'},{en:'The market',bn:'বাজার'},{en:'The sector',bn:'সেক্টর'}],ans:1,ref:'Ch. 12'},
   {q:{en:'Does a Point and Figure chart tell you what price will do next?',bn:'পয়েন্ট অ্যান্ড ফিগার চার্ট কি বলে দেয় দাম এরপর কী করবে?'},opts:[{en:'Yes, reliably',bn:'হ্যাঁ, নির্ভরযোগ্যভাবে'},{en:'No, it describes what has happened',bn:'না, যা ঘটেছে তা বর্ণনা করে'}],ans:1,ref:'Method limits'}
  ];
}
P_.check=function(m,mode){
  mode=mode==='post'?'post':'pre';var qs=checkQs(),i=0,score=0;
  crumbs(m,'<a href="#/learn">'+t('learn')+'</a> / '+(mode==='pre'?'Check before':'Check after'));

      box.appendChild(el('div',{'class':'callout'},'<h2 style="margin:0 0 8px">'+score+' of 8</h2><p style="margin:0">'+(pg.pre!=null&&pg.post!=null?'Before: '+pg.pre+'. After: '+pg.post+'. Change: '+(pg.post-pg.pre>=0?'+':'')+(pg.post-pg.pre)+' correct answers.':(mode==='pre'?'Now try lessons 1 to 6, then take the check again.':'Take the check before lesson 1 to see your change.'))+'</p><div class="btns"><a class="btn" href="#/learn">'+(mode==='pre'?'Go to the lessons':'Back to the lessons')+'</a></div>'));return}

/* ---------- glossary, rules, limits ---------- */
var TERMS=[
 ['X',{en:'A mark meaning price rose through one more box.',bn:'দাম আরও এক বক্স উঠেছে বোঝানো চিহ্ন।'}],
 ['O',{en:'A mark meaning price fell through one more box.',bn:'দাম আরও এক বক্স নেমেছে বোঝানো চিহ্ন।'}],
 ['Box',{en:'A fixed price step. Moves smaller than one box are not drawn.',bn:'নির্দিষ্ট দামের ধাপ। এক বক্সের চেয়ে ছোট নড়াচড়া আঁকা হয় না।'}],
 ['Column',{en:'A vertical run of X’s or O’s. It continues while price keeps making new boxes in one direction.',bn:'X বা O-এর উল্লম্ব সারি। একই দিকে নতুন বক্স তৈরি হলে চলতে থাকে।'}],
 ['Three-box reversal',{en:'The rule that a new column of the other symbol starts only after price reverses by three boxes.',bn:'উল্টো দিকে তিন বক্স গেলেই কেবল অন্য চিহ্নের নতুন কলাম শুরু হওয়ার নিয়ম।'}],
 ['Level',{en:'A price where one side stopped the other, seen as a ceiling or a floor.',bn:'এমন দাম যেখানে এক পক্ষ অন্য পক্ষকে থামিয়েছে; ছাদ বা মেঝে হিসেবে দেখা যায়।'}],
 ['45-degree line',{en:'A line that moves one box per column. It shows which side has kept control over a longer stretch.',bn:'প্রতি কলামে এক বক্স সরে এমন রেখা। দীর্ঘ সময়ে কে নিয়ন্ত্রণে ছিল তা দেখায়।'}],
 ['Top-down reading',{en:'Reading the market first, then the sector, then the stock.',bn:'আগে বাজার, তারপর সেক্টর, তারপর শেয়ার পড়া।'}],
 ['Relative strength',{en:'One chart divided by another, to see whether a stock or sector is stronger or weaker than its benchmark. Covered in a later lesson.',bn:'একটি চার্টকে অন্যটি দিয়ে ভাগ করে দেখা কোনো শেয়ার বা সেক্টর বেঞ্চমার্কের চেয়ে শক্তিশালী না দুর্বল। পরের পাঠে।'}],
 ['Bullish Percent',{en:'The share of stocks whose latest column is a column of X’s. A measure of the market’s breadth, as the book defines it.',bn:'যেসব শেয়ারের সর্বশেষ কলাম X-এর, তাদের শতাংশ। বইয়ের সংজ্ঞায় বাজারের বিস্তারের পরিমাপ।'}]
];
