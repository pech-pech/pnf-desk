P_.learn=function(m){

  m.appendChild(el('p',{'class':'lede'},lang==='bn'?'প্রতিটি পাঠে চারটি ধাপ: দেখুন, নাম জানুন, চেষ্টা করুন, মিলিয়ে নিন।':'Every lesson has the same four steps: see, name, try, check. Six lessons here; the rest come later.'));

    '<div class="btns" style="margin:0"><a class="btn ghost" href="#/check/pre">'+(pg.pre!=null?'Before: '+pg.pre+'/8':'Take it before')+'</a><a class="btn ghost" href="#/check/post">'+(pg.post!=null?'After: '+pg.post+'/8':'Take it after')+'</a></div>'+(pg.pre!=null&&pg.post!=null?'<p class="small ok" style="margin:10px 0 0">Change: '+(pg.post-pg.pre>=0?'+':'')+(pg.post-pg.pre)+' correct answers.</p>':'')));
  var g=el('div',{'class':'grid'});
  LESSONS.forEach(function(l){g.appendChild(el('a',{'class':'card',href:'#/learn/'+l.id},'<p class="small mut num" style="margin:0 0 4px">'+(lang==='bn'?'পাঠ ':'Lesson ')+l.id+(pg.lessons&&pg.lessons[l.id]?' <span class="tick">done</span>':'')+'</p><h3 style="margin:0">'+esc(L(l.title))+'</h3>'))});
  [['7','Double and triple tops and bottoms'],['8','Triangles and the catapult'],['9','Signals and their limits'],['10','Relative strength'],['11','Bullish Percent'],['12','The full checklist']].forEach(function(x){g.appendChild(el('div',{'class':'card',style:'opacity:.55'},'<p class="small mut num" style="margin:0 0 4px">Lesson '+x[0]+' · coming later</p><h3 style="margin:0">'+x[1]+'</h3>'))});

function optionList(q,onDone){
  var wrap=el('div'),done=false;
  wrap.appendChild(el('p',{'class':'head',style:'font:600 18px var(--disp);margin-bottom:10px'},esc(L(q.q))));
  var btns=q.opts.map(function(o,i){var b=el('button',{type:'button','class':'opt'},'<span>'+esc(L(o))+'</span><span class="tag"></span>');
    b.onclick=function(){if(done)return;done=true;btns.forEach(function(x,j){x.disabled=true;if(j===q.ans){x.classList.add('right');x.lastChild.textContent=lang==='bn'?'সঠিক':'right'}else if(j===i){x.classList.add('wrong');x.lastChild.textContent=lang==='bn'?'ভুল':'not this'}});onDone(i===q.ans,wrap)};
    wrap.appendChild(b);return b});
  return wrap;
}
P_.lesson=function(m,id){
  var l=LESSONS.filter(function(x){return String(x.id)===String(id)})[0];
  if(!l){m.appendChild(el('h1',{id:'pg'},'Not found'));return}
  crumbs(m,'<a href="#/learn">'+t('learn')+'</a> / '+(lang==='bn'?'পাঠ ':'Lesson ')+l.id);
  m.appendChild(el('h1',{id:'pg'},(lang==='bn'?'পাঠ ':'Lesson ')+l.id+' · '+esc(L(l.title))));
  m.appendChild(el('ol',{'class':'loop'},['See','Name','Try','Check'].map(function(s,i){return '<li><b>'+(i+1)+'</b>'+(lang==='bn'?['দেখুন','নাম','চেষ্টা','মিলান'][i]:s)+'</li>'}).join('')));
  var sv=l.see();
  m.appendChild(el('h2',{style:'margin-top:8px'},'1 · '+(lang==='bn'?'দেখুন':'See')));
  if(sv.ctx){var cx=el('div',{'class':'grid',style:'margin-bottom:14px'});var mc=el('div',{'class':'card'},'<h3>'+(lang==='bn'?'বাজার':'Market')+'</h3><p class="small">'+esc(readingMarket().why)+'</p>');var ms=el('div');mc.appendChild(el('div',{'class':'chartbox'})).appendChild(ms);cx.appendChild(mc);
    cx.appendChild(el('div',{'class':'card'},'<h3>'+(lang==='bn'?'সেক্টর':'Sector')+'</h3><p class="small">'+esc(sectorLine(F('BRACBANK')))+'</p>'));m.appendChild(cx);setTimeout(function(){drawChart(ms,D.dsex.chart,{cols:fitN(D.dsex.chart,12,16),interactive:false,aria:'DSEX chart'})},0)}
  m.appendChild(chartBlock(sv.chart,sv.o));
  m.appendChild(el('h2',null,'2 · '+(lang==='bn'?'নাম জানুন':'Name')));
  m.appendChild(el('div',{'class':'callout'},'<p style="margin:0;font-size:19px">'+esc(L(l.name))+'</p>'));
  m.appendChild(el('h2',null,'3 · '+(lang==='bn'?'চেষ্টা করুন':'Try')));
  var qs=l.qs(),answered=0,correct=0,tryBox=el('div');m.appendChild(tryBox);
  var chk=el('div',{hidden:''});
  function finish(){var pg=load();pg.lessons=pg.lessons||{};pg.lessons[l.id]=true;save(pg);chk.hidden=false;chk.scrollIntoView({block:'nearest'})}
  qs.forEach(function(q){tryBox.appendChild(optionList(q,function(ok,w){answered++;if(ok)correct++;
    if(q.fact)w.appendChild(el('p',{'class':'small',style:'margin-top:6px'},esc(L(q.fact))));
    if(answered===qs.length)finish()}))});
  chk.appendChild(el('h2',null,'4 · '+(lang==='bn'?'মিলিয়ে নিন':'Check')));
  var res=el('div',{'class':'callout'});chk.appendChild(res);
  m.appendChild(chk);
  var nxt=LESSONS.filter(function(x){return x.id===l.id+1})[0];
  var oc=l.check();
  var obs=new MutationObserver(function(){if(!chk.hidden){res.innerHTML='<p style="margin:0 0 6px"><b>'+(correct===qs.length?(lang==='bn'?'সব সঠিক।':'All correct.'):(lang==='bn'?correct+'/'+qs.length+' সঠিক।':correct+' of '+qs.length+' correct.'))+'</b></p><p style="margin:0">'+esc(L(oc))+'</p>';
    chk.appendChild(el('div',{'class':'btns'},(nxt?'<a class="btn" href="#/learn/'+nxt.id+'">Next: lesson '+nxt.id+'</a>':'<a class="btn" href="#/check/post">Take the check again</a>')+'<a class="btn ghost" href="#/learn">All lessons</a>'));obs.disconnect()}});
  obs.observe(chk,{attributes:true,attributeFilter:['hidden']});
};

  return [
   {q:{en:'What does an X mean on the chart?',bn:'চার্টে X মানে কী?'},opts:ox,ans:0,ref:'Ch. 2'},
   {q:{en:'What does an O mean on the chart?',bn:'চার্টে O মানে কী?'},opts:ox,ans:1,ref:'Ch. 2'},
   {q:{en:'In the standard method, how many boxes must price reverse before a new column starts?',bn:'প্রচলিত পদ্ধতিতে নতুন কলাম শুরুর আগে দাম কত বক্স উল্টো যেতে হয়?'},opts:[{en:'One',bn:'এক'},{en:'Three',bn:'তিন'},{en:'Five',bn:'পাঁচ'}],ans:1,ref:'Ch. 2, reversal'},
   {q:{en:'Which of these does the chart leave out?',bn:'চার্ট এর মধ্যে কোনটি বাদ দেয়?'},opts:[{en:'Price',bn:'দাম'},{en:'The passing of time',bn:'সময়ের চলে যাওয়া'},{en:'Box size',bn:'বক্সের মাপ'}],ans:1,ref:'Ch. 2'},

   {q:{en:'In a top-down reading, which do you read first?',bn:'ওপর থেকে নিচে পাঠে আগে কোনটি পড়েন?'},opts:[{en:'The single stock',bn:'একটি শেয়ার'},{en:'The market',bn:'বাজার'},{en:'The sector',bn:'সেক্টর'}],ans:1,ref:'Ch. 12'},

P_.check=function(m,mode){
  mode=mode==='post'?'post':'pre';var qs=checkQs(),i=0,score=0;
  crumbs(m,'<a href="#/learn">'+t('learn')+'</a> / '+(mode==='pre'?'Check before':'Check after'));
  m.appendChild(el('h1',{id:'pg'},mode==='pre'?'8-question check, before lesson 1':'8-question check, after lesson 6'));
  var box=el('div');m.appendChild(box);
  function show(){
    box.innerHTML='';
    if(i>=qs.length){var pg=load();pg[mode]=score;save(pg);
      box.appendChild(el('div',{'class':'callout'},'<h2 style="margin:0 0 8px">'+score+' of 8</h2><p style="margin:0">'+(pg.pre!=null&&pg.post!=null?'Before: '+pg.pre+'. After: '+pg.post+'. Change: '+(pg.post-pg.pre>=0?'+':'')+(pg.post-pg.pre)+' correct answers.':(mode==='pre'?'Now try lessons 1 to 6, then take the check again.':'Take the check before lesson 1 to see your change.'))+'</p><div class="btns"><a class="btn" href="#/learn">'+(mode==='pre'?'Go to the lessons':'Back to the lessons')+'</a></div>'));return}
    var q=qs[i];box.appendChild(el('div',{'class':'prog',role:'progressbar','aria-valuemin':'0','aria-valuemax':'8','aria-valuenow':String(i)},'<i style="width:'+(i/8*100)+'%"></i>'));
    box.appendChild(el('p',{'class':'small mut num'},'Question '+(i+1)+' of 8 · '+q.ref));
    if(q.chart)box.appendChild(chartBlock(q.chart.chart,{cols:16,trend:!!q.trend,price:q.chart.price,aria:q.chart.name+' chart',interactive:false,table:false}));
    var ol=optionList(q,function(ok,w){if(ok)score++;w.appendChild(el('div',{'class':'btns'},'<button class="btn" id="nx" type="button">'+(i===7?'See my score':'Next question')+'</button>'));$('#nx',w).onclick=function(){i++;show()};$('#nx',w).focus()});
    box.appendChild(ol);
  }
  show();
};

/* ---------- glossary, rules, limits ---------- */
var TERMS=[
 ['X',{en:'A mark meaning price rose through one more box.',bn:'দাম আরও এক বক্স উঠেছে বোঝানো চিহ্ন।'}],
 ['O',{en:'A mark meaning price fell through one more box.',bn:'দাম আরও এক বক্স নেমেছে বোঝানো চিহ্ন।'}],
 ['Box',{en:'A fixed price step. Moves smaller than one box are not drawn.',bn:'নির্দিষ্ট দামের ধাপ। এক বক্সের চেয়ে ছোট নড়াচড়া আঁকা হয় না।'}],
 ['Column',{en:'A vertical run of X’s or O’s. It continues while price keeps making new boxes in one direction.',bn:'X বা O-এর উল্লম্ব সারি। একই দিকে নতুন বক্স তৈরি হলে চলতে থাকে।'}],
 ['Three-box reversal',{en:'The rule that a new column of the other symbol starts only after price reverses by three boxes.',bn:'উল্টো দিকে তিন বক্স গেলেই কেবল অন্য চিহ্নের নতুন কলাম শুরু হওয়ার নিয়ম।'}],
 ['Level',{en:'A price where one side stopped the other, seen as a ceiling or a floor.',bn:'এমন দাম যেখানে এক পক্ষ অন্য পক্ষকে থামিয়েছে; ছাদ বা মেঝে হিসেবে দেখা যায়।'}],
 ['45-degree line',{en:'A line that moves one box per column. It shows which side has kept control over a longer stretch.',bn:'প্রতি কলামে এক বক্স সরে এমন রেখা। দীর্ঘ সময়ে কে নিয়ন্ত্রণে ছিল তা দেখায়।'}],
 ['Top-down reading',{en:'Reading the market first, then the sector, then the stock.',bn:'আগে বাজার, তারপর সেক্টর, তারপর শেয়ার পড়া।'}],
 ['Relative strength',{en:'One chart divided by another, to see whether a stock or sector is stronger or weaker than its benchmark. Covered in a later lesson.',bn:'একটি চার্টকে অন্যটি দিয়ে ভাগ করে দেখা কোনো শেয়ার বা সেক্টর বেঞ্চমার্কের চেয়ে শক্তিশালী না দুর্বল। পরের পাঠে।'}],
 ['Bullish Percent',{en:'The share of stocks whose latest column is a column of X’s. A measure of the market’s breadth, as the book defines it.',bn:'যেসব শেয়ারের সর্বশেষ কলাম X-এর, তাদের শতাংশ। বইয়ের সংজ্ঞায় বাজারের বিস্তারের পরিমাপ।'}]
];
P_.glossary=function(m){
  m.appendChild(el('h1',{id:'pg'},t('gloss')));
  var h='';TERMS.forEach(function(x){h+='<div class="card" id="'+esc(x[0].replace(/\W+/g,'-'))+'" style="margin-bottom:10px"><h3 style="margin-bottom:4px">'+esc(x[0])+'</h3><p style="margin:0">'+esc(L(x[1]))+'</p></div>'});

P_.rules=function(m){
  var f=F('GP'),c=f.chart,n=c.cols.length,h='<div class="tw"><table><thead><tr><th class="n">Column</th><th>Kind</th><th class="n">From</th><th class="n">To</th><th class="n">Boxes</th></tr></thead><tbody>';
  for(var i=n-6;i<n;i++){var r=colRange(c,i);h+='<tr><td class="n">'+(i+1)+'</td><td>'+c.cols[i][0]+'</td><td class="n">'+lab(r[0])+'</td><td class="n">'+lab(r[1])+'</td><td class="n">'+(c.cols[i][2]-c.cols[i][1]+1)+'</td></tr>'}
  m.appendChild(el('h1',{id:'pg'},lang==='bn'?'চার্টের নিয়ম':'Chart rules'));
  m.appendChild(el('p',{'class':'lede'},'The rules are open, so you can rebuild any chart by hand. The method follows Thomas Dorsey, Point and Figure Charting (3rd ed.).'));
  m.appendChild(el('div',{'class':'card'},'<table><tbody><tr><td><b>Box scale</b></td><td>0.25 below Tk 5; 0.5 to Tk 20; 1 to Tk 100; 2 to Tk 200; 4 above</td></tr><tr><td><b>Reversal</b></td><td>3 boxes</td></tr><tr><td><b>Input</b></td><td>Daily highs and lows, one direction per day</td></tr><tr><td><b>Price data</b></td><td>End of day to '+fd(D.asof)+'</td></tr></tbody></table>'));
  m.appendChild(el('h2',null,'Rebuild one by hand: the last six columns of GP'));
  m.appendChild(el('div',{'class':'card'},'<p class="small mut" style="margin-top:0">Box size '+tk(f.box)+'. A column continues while price makes a new box in its direction. It turns only after a move of three boxes the other way.</p>'+h+'</tbody></table></div>'));
  m.appendChild(el('h2',null,'Wording check'));
  var ok=BAN.found.length===0;
  m.appendChild(el('div',{'class':'card'},'<p style="margin:0"><b class="'+(ok?'ok':'bad')+'">'+(ok?'Passed':'Failed')+'</b>: '+BAN.checked+' generated readings checked in English and Bengali for forecasting words (target, likely, expected to, bullish, bearish, pick, will rise, will fall, buy, sell, hold). '+(ok?'None found.':'Found: '+esc(BAN.found.join(' | ')))+'</p><p class="small mut" style="margin:8px 0 0">The book’s term “Bullish Percent” is exempt. Lessons and the game may use method terms; generated chart readings may not.</p>'));
};
P_.limits=function(m){
  m.appendChild(el('h1',{id:'pg'},lang==='bn'?'এই চার্ট কী বলতে পারে না':'What this cannot tell you'));
  m.appendChild(el('div',{'class':'card'},'<ul style="padding-left:20px;margin:0"><li>It describes what buyers and sellers have already done. It does not say what they will do next.</li><li>A pattern is a shape in past prices. It carries no promise.</li><li>A chart can look the same for weeks. Quiet periods add nothing.</li><li>It leaves out time and the number of shares traded.</li><li>Data can contain errors. Each page shows the date its prices run to.</li></ul>'));
};
