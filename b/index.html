P_.rules=function(m){
  var f=F('GP'),c=f.chart,n=c.cols.length,h='<div class="tw"><table><thead><tr><th class="n">Column</th><th>Kind</th><th class="n">From</th><th class="n">To</th><th class="n">Boxes</th></tr></thead><tbody>';
  for(var i=n-6;i<n;i++){var r=colRange(c,i);h+='<tr><td class="n">'+(i+1)+'</td><td>'+c.cols[i][0]+'</td><td class="n">'+lab(r[0])+'</td><td class="n">'+lab(r[1])+'</td><td class="n">'+(c.cols[i][2]-c.cols[i][1]+1)+'</td></tr>'}
  m.appendChild(el('h1',{id:'pg'},lang==='bn'?'চার্টের নিয়ম':'Chart rules'));
  m.appendChild(el('p',{'class':'lede'},'The rules are open, so you can rebuild any chart by hand. The method follows Thomas Dorsey, Point and Figure Charting (3rd ed.).'));
  m.appendChild(el('div',{'class':'card'},'<table><tbody><tr><td><b>Box scale</b></td><td>0.25 below Tk 5; 0.5 to Tk 20; 1 to Tk 100; 2 to Tk 200; 4 above</td></tr><tr><td><b>Reversal</b></td><td>3 boxes</td></tr><tr><td><b>Input</b></td><td>Daily highs and lows, one direction per day</td></tr><tr><td><b>Price data</b></td><td>End of day to '+fd(D.asof)+'</td></tr></tbody></table>'));
  m.appendChild(el('h2',null,'Rebuild one by hand: the last six columns of GP'));
  m.appendChild(el('div',{'class':'card'},'<p class="small mut" style="margin-top:0">Box size '+tk(f.box)+'. A column continues while price makes a new box in its direction. It turns only after a move of three boxes the other way.</p>'+h+'</tbody></table></div>'));
  m.appendChild(el('h2',null,'Wording check'));
  var ok=BAN.found.length===0;
  m.appendChild(el('div',{'class':'card'},'<p style="margin:0"><b class="'+(ok?'ok':'bad')+'">'+(ok?'Passed':'Failed')+'</b>: '+BAN.checked+' generated readings checked in English and Bengali for forecasting words (target, likely, expected to, bullish, bearish, pick, will rise, will fall, buy, sell, hold). '+(ok?'None found.':'Found: '+esc(BAN.found.join(' | ')))+'</p><p class="small mut" style="margin:8px 0 0">The book’s term “Bullish Percent” is exempt. Lessons and the game may use method terms; generated chart readings may not.</p>'));
};
P_.limits=function(m){
  m.appendChild(el('h1',{id:'pg'},lang==='bn'?'এই চার্ট কী বলতে পারে না':'What this cannot tell you'));
  m.appendChild(el('div',{'class':'card'},'<ul style="padding-left:20px;margin:0"><li>It describes what buyers and sellers have already done. It does not say what they will do next.</li><li>A pattern is a shape in past prices. It carries no promise.</li><li>A chart can look the same for weeks. Quiet periods add nothing.</li><li>It leaves out time and the number of shares traded.</li><li>Data can contain errors. Each page shows the date its prices run to.</li></ul>'));
};

/* ---------- router and chrome ---------- */
var NAV=[['','home'],['learn','learn'],['screener','screener'],['market','market'],['game','game'],['rules','rules'],['glossary','gloss'],['limits','limits']];
var ROUTES={'':'home',screener:'screener',charts:'screener',stocks:'stocks',stock:'stock',market:'market',learn:'learn',check:'check',glossary:'glossary',rules:'rules',limits:'limits'};
function chrome(cur){
  $('#banner').textContent=t('banner')+fd(D.asof)+'.';
  $('#foot').innerHTML='<span>'+esc(t('foot'))+'</span>';
  var n=$('#nav');n.innerHTML='';
  NAV.forEach(function(x){if(x[0]==='game'){n.appendChild(el('span',{title:lang==='bn'?'পরে আসছে':'Coming later'},t(x[1])));return}
    var a=el('a',{href:'#/'+x[0]},t(x[1]));if(x[0]===cur||(cur==='stock'&&x[0]==='stocks')||(cur==='check'&&x[0]==='learn'))a.setAttribute('aria-current','page');n.appendChild(a)});
  var pa=$('#path');if(pa){var pg=load(),dn=pg.lessons?Object.keys(pg.lessons).length:0;pa.innerHTML=(lang==='bn'?'পাঠের পথ':'Lesson path')+'<b>'+dn+' of 6 done</b>'}
  $('#lang').textContent=lang==='en'?'বাংলা':'EN';document.documentElement.lang=lang;
}
function route(){
  var p=location.hash.replace(/^#\/?/,'').split('/'),m=$('#app');m.innerHTML='';var key=p[0];
  if(key==='learn'&&p[1])P_.lesson(m,p[1]);
  else if(ROUTES[key]!=null&&P_[ROUTES[key]])P_[ROUTES[key]](m,p[1]);
  else{m.appendChild(el('h1',{id:'pg'},'Page not found'));m.appendChild(el('p',null,'<a href="#/">Go home</a>'))}
  chrome(key==='learn'&&p[1]?'learn':key);
  var h=$('#pg');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.skip');if(a){e.preventDefault();var h=$('#pg')||$('#app');h.setAttribute('tabindex','-1');h.focus()}});
document.addEventListener('DOMContentLoaded',function(){
  banCheck();
  $('#lang').onclick=function(){lang=lang==='en'?'bn':'en';try{localStorage.setItem('pnfs_lang',lang)}catch(e){}route()};
  route();
});
window.__pnf={BAN:function(){return BAN},D:D};
})();
</script>
